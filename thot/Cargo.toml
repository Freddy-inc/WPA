[package]
name = "thot"
version = "0.1.0"
edition = "2021"
description = "Thot MVP vertical slice — PDF study loop with free AI glossary, fiches, and quiz"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
lopdf = "0.34"
msedge-tts = { version = "0.4", default-features = false, features = ["tokio-runtime"] }
pdf-extract = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
# Explicit provider: reqwest (ring) + msedge-tts (aws-lc-rs) both pull rustls.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }

[profile.release]
lto = true
codegen-units = 1
