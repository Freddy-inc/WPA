<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thot — démo MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1f2e;
      --muted: #5c6578;
      --line: #d8dde8;
      --bg: #f3f0ea;
      --panel: #fffcf7;
      --accent: #0f6b5c;
      --accent-2: #c45c26;
      --ok: #1f7a4c;
      --warn: #8a6d1d;
      --bad: #a33b2d;
      --shadow: 0 12px 40px rgba(26, 31, 46, 0.08);
      --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-body: "Source Sans 3", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 0%, #e8efe9 0%, transparent 45%),
        radial-gradient(ellipse at 90% 10%, #f3e4d6 0%, transparent 40%),
        var(--bg);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem 0.5rem;
      max-width: 960px;
      margin: 0 auto;
    }
    header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.75rem);
      margin: 0;
      letter-spacing: -0.02em;
    }
    header p { color: var(--muted); margin: 0.35rem 0 0; max-width: 38rem; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
      display: grid;
      gap: 1rem;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem 1.25rem;
    }
    section h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      margin: 0 0 0.75rem;
    }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.25rem; }
    select, input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
      color: var(--ink);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    button {
      font: inherit;
      font-weight: 600;
      border: none;
      cursor: pointer;
      padding: 0.55rem 0.95rem;
      background: var(--accent);
      color: #fff;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .meta { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .preview {
      margin-top: 0.75rem;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.45;
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      color: #2a3142;
    }
    .banner {
      margin-top: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      background: #f7faf8;
    }
    .banner .term { font-family: var(--font-display); font-size: 1.15rem; }
    .badge {
      display: inline-block;
      margin-top: 0.45rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.2rem 0.45rem;
    }
    .badge.ok { background: #d9eee2; color: var(--ok); }
    .badge.warn { background: #f3e9c8; color: var(--warn); }
    .sources { margin: 0.5rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; }
    .sources a { color: var(--accent); }
    .status-pill {
      display: inline-block;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .fiche {
      border-top: 1px solid var(--line);
      padding: 0.65rem 0;
    }
    .fiche strong { display: block; }
    .err { color: var(--bad); font-size: 0.9rem; margin-top: 0.5rem; }
    .okmsg { color: var(--ok); font-size: 0.9rem; margin-top: 0.5rem; }
    .quiz-q { border-top: 1px solid var(--line); padding: 0.7rem 0; }
    .quiz-q ul { margin: 0.35rem 0 0; padding-left: 1.1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Thot</h1>
    <p>Tranche verticale MVP — importer un PDF, définir un terme L2→L1 (sources web), générer fiches ou quiz. IA gratuite uniquement (Groq / Ollama).</p>
    <p class="meta"><span id="provider" class="status-pill">…</span></p>
  </header>

  <main>
    <section id="langs">
      <h2>1. Langues</h2>
      <div class="row">
        <div>
          <label for="l1">L1 (ma langue)</label>
          <select id="l1">
            <option value="fr" selected>Français</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
        <div>
          <label for="l2">L2 (langue du cours)</label>
          <select id="l2">
            <option value="en" selected>English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="saveLangs">Enregistrer</button>
      </div>
      <div id="langMsg"></div>
    </section>

    <section id="import">
      <h2>2. Importer le PDF</h2>
      <label for="pdf">Fichier PDF (texte extractible)</label>
      <input type="file" id="pdf" accept="application/pdf,.pdf" />
      <div class="actions">
        <button type="button" id="importBtn">Importer</button>
      </div>
      <div id="importMsg"></div>
      <div id="preview" class="preview" hidden></div>
    </section>

    <section id="glossary">
      <h2>3. Glossaire</h2>
      <label for="term">Terme L2 (mot / expression courte)</label>
      <input type="text" id="term" placeholder="ex. photosynthesis" />
      <div class="actions">
        <button type="button" id="defineBtn">Définir</button>
      </div>
      <div id="glossaryMsg"></div>
      <div id="glossaryBanner" class="banner" hidden></div>
    </section>

    <section id="generate">
      <h2>4. Générer</h2>
      <p class="meta">Un chemin de génération à la fois — fiches <em>ou</em> quiz depuis le texte extrait.</p>
      <div class="actions">
        <button type="button" id="fichesBtn">Générer fiches</button>
        <button type="button" class="secondary" id="quizBtn">Générer quiz</button>
      </div>
      <div id="genMsg"></div>
      <div id="fichesOut"></div>
      <div id="quizOut"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function setMsg(el, text, ok) {
      el.className = ok ? "okmsg" : "err";
      el.textContent = text || "";
    }

    async function refreshStatus() {
      try {
        const s = await api("/api/status");
        const label = s.groq_key_present
          ? `LLM: Groq (${s.provider})`
          : `LLM: ${s.provider} (pas de GROQ_API_KEY — Ollama)`;
        $("provider").textContent = label;
        if (s.course?.has_text) {
          $("preview").hidden = false;
          $("preview").textContent = s.course.preview || "";
        }
        if (s.course?.l1) $("l1").value = s.course.l1;
        if (s.course?.l2) $("l2").value = s.course.l2;
      } catch (e) {
        $("provider").textContent = "API indisponible";
      }
    }

    $("saveLangs").onclick = async () => {
      try {
        const body = { l1: $("l1").value, l2: $("l2").value };
        await api("/api/languages", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        setMsg($("langMsg"), `Paire enregistrée : ${body.l1} ← ${body.l2}`, true);
      } catch (e) {
        setMsg($("langMsg"), e.message, false);
      }
    };

    $("importBtn").onclick = async () => {
      const file = $("pdf").files[0];
      if (!file) return setMsg($("importMsg"), "Choisissez un PDF", false);
      const fd = new FormData();
      fd.append("file", file);
      $("importBtn").disabled = true;
      try {
        const data = await api("/api/import", { method: "POST", body: fd });
        setMsg($("importMsg"), `Import OK — ${data.filename} (${data.char_count} car.)`, true);
        $("preview").hidden = false;
        $("preview").textContent = data.preview || "";
      } catch (e) {
        setMsg($("importMsg"), e.message, false);
      } finally {
        $("importBtn").disabled = false;
      }
    };

    $("defineBtn").onclick = async () => {
      const term = $("term").value.trim();
      if (!term) return setMsg($("glossaryMsg"), "Entrez un terme", false);
      $("defineBtn").disabled = true;
      $("glossaryBanner").hidden = true;
      setMsg($("glossaryMsg"), "Recherche du sens…", true);
      try {
        const g = await api("/api/glossary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ term }),
        });
        setMsg($("glossaryMsg"), g.cached ? "Depuis le cache SQLite" : "Nouveau sens généré", true);
        const badgeClass = g.verified ? "ok" : "warn";
        const sources = (g.sources || [])
          .map((s) => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.kind}: ${s.title}</a></li>`)
          .join("");
        $("glossaryBanner").innerHTML = `
          <div class="term">L2: ${escapeHtml(g.term_l2)}</div>
          <div>${escapeHtml(g.meaning_l1)}</div>
          <span class="badge ${badgeClass}">${escapeHtml(g.badge)}</span>
          ${sources ? `<ul class="sources">${sources}</ul>` : ""}
        `;
        $("glossaryBanner").hidden = false;
      } catch (e) {
        setMsg($("glossaryMsg"), e.message, false);
      } finally {
        $("defineBtn").disabled = false;
      }
    };

    async function generate(kind) {
      $("fichesBtn").disabled = true;
      $("quizBtn").disabled = true;
      setMsg($("genMsg"), `Génération ${kind}… (peut prendre ~10–60 s)`, true);
      try {
        const data = await api("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind }),
        });
        if (data.kind === "fiches") {
          $("quizOut").innerHTML = "";
          $("fichesOut").innerHTML = (data.fiches || [])
            .map((f) => `<div class="fiche"><strong>${escapeHtml(f.front)}</strong><span>${escapeHtml(f.back)}</span></div>`)
            .join("");
          setMsg($("genMsg"), `${data.fiches.length} fiches générées`, true);
        } else {
          $("fichesOut").innerHTML = "";
          $("quizOut").innerHTML = (data.questions || [])
            .map((q, i) => {
              const choices = (q.choices || [])
                .map((c, j) => `<li${j === q.answer_index ? ' style="font-weight:700"' : ""}>${escapeHtml(c)}</li>`)
                .join("");
              return `<div class="quiz-q"><strong>Q${i + 1}.</strong> ${escapeHtml(q.question)}<ul>${choices}</ul><div class="meta">Notion : ${escapeHtml(q.notion || "—")}</div></div>`;
            })
            .join("");
          setMsg($("genMsg"), `${data.count} questions générées`, true);
        }
      } catch (e) {
        setMsg($("genMsg"), e.message, false);
      } finally {
        $("fichesBtn").disabled = false;
        $("quizBtn").disabled = false;
      }
    }

    $("fichesBtn").onclick = () => generate("fiches");
    $("quizBtn").onclick = () => generate("quiz");

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    refreshStatus();
  </script>
</body>
</html>
